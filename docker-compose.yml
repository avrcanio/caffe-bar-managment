services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis-postgis-1
    environment:
      POSTGRES_USER: postgis
      POSTGRES_PASSWORD: postgis
      POSTGRES_DB: mozzart_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis_postgis_data16:/var/lib/postgresql/data
    networks:
      - hetzner_net
  tailscale-postgis:
    image: tailscale/tailscale:latest
    container_name: tailscale-postgis
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_POSTGIS}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: >-
        --login-server=https://hs-control.qubitsecured.online
        --hostname=tailscale-postgis
    volumes:
      - tailscale_postgis_state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - postgis
    restart: unless-stopped
    network_mode: service:postgis
  redis:
    image: redis:7-alpine
    container_name: mozzart-redis
    networks:
      - hetzner_net
  web:
    build: .
    container_name: mozzart
    command: bash -lc "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./app:/app
      - ./03442668895.F1.1.p12:/app/fiscal_cert.p12:ro
      - ./demo2014_root_ca.cer:/app/demo2014_root_ca.cer:ro
      - ./demo2014_root_ca.pem:/app/demo2014_root_ca.pem:ro
      - ./fina_demo_ca_bundle.pem:/app/fina_demo_ca_bundle.pem:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgis:postgis@postgis:5432/mozzart_db
    depends_on:
      - redis
    ports:
      - "8003:8000"
    networks:
      - hetzner_net
  celery_worker:
    build: .
    container_name: mozzart-celery-worker
    command: celery -A config worker -l info
    volumes:
      - ./app:/app
      - ./03442668895.F1.1.p12:/app/fiscal_cert.p12:ro
      - ./demo2014_root_ca.cer:/app/demo2014_root_ca.cer:ro
      - ./demo2014_root_ca.pem:/app/demo2014_root_ca.pem:ro
      - ./fina_demo_ca_bundle.pem:/app/fina_demo_ca_bundle.pem:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgis:postgis@postgis:5432/mozzart_db
    depends_on:
      - redis
    networks:
      - hetzner_net
  celery_beat:
    build: .
    container_name: mozzart-celery-beat
    command: celery -A config beat -l info
    volumes:
      - ./app:/app
      - ./03442668895.F1.1.p12:/app/fiscal_cert.p12:ro
      - ./demo2014_root_ca.cer:/app/demo2014_root_ca.cer:ro
      - ./demo2014_root_ca.pem:/app/demo2014_root_ca.pem:ro
      - ./fina_demo_ca_bundle.pem:/app/fina_demo_ca_bundle.pem:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgis:postgis@postgis:5432/mozzart_db
    depends_on:
      - redis
    networks:
      - hetzner_net
  frontend:
    image: node:20-alpine
    container_name: mozzart-frontend
    working_dir: /app
    command: sh -lc "npm install && npm run build && npm run start -- -p 3000"
    volumes:
      - ./frontend:/app
    ports:
      - "3001:3000"
    depends_on:
      - web
    networks:
      - hetzner_net
  webterm:
    build: ./webterm
    container_name: mozzart-webterm
    command: ["ttyd", "-p", "7681", "-b", "/api/webterm", "-W", "-w", "/workspace", "/bin/bash"]
    environment:
      HISTFILE: /tmp/.bash_history
      HOME: /home/codex
    volumes:
      - /srv/mozzart:/workspace
      - webterm_home:/home/codex
    working_dir: /workspace
    expose:
      - "7681"
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - hetzner_net

networks:
  hetzner_net:
    external: true

volumes:
  postgis_postgis_data16:
    external: true
  tailscale_postgis_state:
  webterm_home:
