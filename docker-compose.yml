services:
  redis:
    image: redis:7-alpine
    container_name: mozzart-redis
    networks:
      - hetzner_net
  print_bridge:
    build: ./printbridge
    container_name: mozzart-print-bridge
    env_file:
      - .env
    expose:
      - "8090"
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - hetzner_net
  tailscale-print-bridge:
    image: tailscale/tailscale:latest
    container_name: tailscale-print-bridge
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_PRINT_BRIDGE}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: >-
        --login-server=https://hs-control.qubitsecured.online
        --hostname=tailscale-print-bridge
    volumes:
      - tailscale_print_bridge_state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - print_bridge
    restart: unless-stopped
    network_mode: service:print_bridge
  web:
    build: .
    container_name: mozzart
    command: bash -lc "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./app:/app
      - ./03442668895.F1.1.p12:/app/fiscal_cert.p12:ro
      - ./demo2014_root_ca.cer:/app/demo2014_root_ca.cer:ro
      - ./demo2014_root_ca.pem:/app/demo2014_root_ca.pem:ro
      - ./fina_demo_ca_bundle.pem:/app/fina_demo_ca_bundle.pem:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgis:postgis@postgis:5432/mozzart_db
    depends_on:
      - redis
      - print_bridge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.mozzart-web.rule=Host(`mozart.sibenik1983.hr`) && (PathPrefix(`/api`) || PathPrefix(`/admin`) || PathPrefix(`/media`) || PathPrefix(`/static`) || PathPrefix(`/download`) || PathPrefix(`/orders/confirm`))"
      - "traefik.http.routers.mozzart-web.entrypoints=websecure"
      - "traefik.http.routers.mozzart-web.tls=true"
      - "traefik.http.routers.mozzart-web.tls.certresolver=cloudflare"
      - "traefik.http.routers.mozzart-web.priority=120"
      - "traefik.http.services.mozzart-web.loadbalancer.server.port=8000"
    networks:
      - hetzner_net
      - proxy
  celery_worker:
    build: .
    container_name: mozzart-celery-worker
    command: celery -A config worker -l info
    volumes:
      - ./app:/app
      - ./03442668895.F1.1.p12:/app/fiscal_cert.p12:ro
      - ./demo2014_root_ca.cer:/app/demo2014_root_ca.cer:ro
      - ./demo2014_root_ca.pem:/app/demo2014_root_ca.pem:ro
      - ./fina_demo_ca_bundle.pem:/app/fina_demo_ca_bundle.pem:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgis:postgis@postgis:5432/mozzart_db
    depends_on:
      - redis
    networks:
      - hetzner_net
  celery_beat:
    build: .
    container_name: mozzart-celery-beat
    command: celery -A config beat -l info
    volumes:
      - ./app:/app
      - ./03442668895.F1.1.p12:/app/fiscal_cert.p12:ro
      - ./demo2014_root_ca.cer:/app/demo2014_root_ca.cer:ro
      - ./demo2014_root_ca.pem:/app/demo2014_root_ca.pem:ro
      - ./fina_demo_ca_bundle.pem:/app/fina_demo_ca_bundle.pem:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgis:postgis@postgis:5432/mozzart_db
    depends_on:
      - redis
    networks:
      - hetzner_net
  frontend:
    image: node:20-alpine
    container_name: mozzart-frontend
    working_dir: /app
    command: sh -lc "npm install && npm run build && npm run start -- -p 3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.mozzart-frontend.rule=Host(`mozart.sibenik1983.hr`)"
      - "traefik.http.routers.mozzart-frontend.entrypoints=websecure"
      - "traefik.http.routers.mozzart-frontend.tls=true"
      - "traefik.http.routers.mozzart-frontend.tls.certresolver=cloudflare"
      - "traefik.http.routers.mozzart-frontend.priority=10"
      - "traefik.http.services.mozzart-frontend.loadbalancer.server.port=3000"
    networks:
      - hetzner_net
      - proxy
  webterm:
    build: ./webterm
    container_name: mozzart-webterm
    command: ["ttyd", "-p", "7681", "-b", "/api/webterm", "-W", "-w", "/workspace", "/bin/bash"]
    environment:
      HISTFILE: /tmp/.bash_history
      HOME: /home/codex
    volumes:
      - /opt/stacks/mozart:/workspace
      - webterm_home:/home/codex
    working_dir: /workspace
    expose:
      - "7681"
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - hetzner_net

networks:
  hetzner_net:
    external: true
  proxy:
    external: true

volumes:
  tailscale_print_bridge_state:
  webterm_home:
