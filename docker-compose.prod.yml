services:
  web:
    build:
      args:
        REQUIREMENTS_FILE: requirements-prod.txt
    command: bash -lc "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - ./03442668895.F1.1.p12:/app/fiscal_cert.p12:ro
      - ./demo2014_root_ca.cer:/app/demo2014_root_ca.cer:ro
      - ./demo2014_root_ca.pem:/app/demo2014_root_ca.pem:ro
      - ./fina_demo_ca_bundle.pem:/app/fina_demo_ca_bundle.pem:ro
    env_file:
      - .env
    restart: unless-stopped
  celery_worker:
    build:
      args:
        REQUIREMENTS_FILE: requirements-prod.txt
    volumes:
      - ./03442668895.F1.1.p12:/app/fiscal_cert.p12:ro
      - ./demo2014_root_ca.cer:/app/demo2014_root_ca.cer:ro
      - ./demo2014_root_ca.pem:/app/demo2014_root_ca.pem:ro
      - ./fina_demo_ca_bundle.pem:/app/fina_demo_ca_bundle.pem:ro
    env_file:
      - .env
    restart: unless-stopped
  celery_beat:
    build:
      args:
        REQUIREMENTS_FILE: requirements-prod.txt
    volumes:
      - ./03442668895.F1.1.p12:/app/fiscal_cert.p12:ro
      - ./demo2014_root_ca.cer:/app/demo2014_root_ca.cer:ro
      - ./demo2014_root_ca.pem:/app/demo2014_root_ca.pem:ro
      - ./fina_demo_ca_bundle.pem:/app/fina_demo_ca_bundle.pem:ro
    env_file:
      - .env
    restart: unless-stopped
  frontend:
    env_file:
      - .env
    restart: unless-stopped
