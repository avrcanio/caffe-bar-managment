name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            cd /opt/stacks/mozart
            git config --global --add safe.directory /opt/stacks/mozart || true
            git fetch origin
            git checkout dev
            git pull origin dev
            docker compose -f docker-compose.yml --env-file .env up -d --build
            docker compose -f docker-compose.yml --env-file .env exec -T web python manage.py migrate --noinput
            docker restart mozzart-celery-worker mozzart-celery-beat
